<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Invite email mockup</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  body { margin:0; padding:32px 16px; background:#ECECEA; font-family:Barlow,Helvetica,Arial,sans-serif; color:#18181B; }
  .frame { max-width:640px; margin:0 auto; }
  .meta { background:#FFFFFF; border:1px solid #DDDDD9; border-radius:10px 10px 0 0; padding:16px 20px; font-size:13px; line-height:1.7; color:#3F3F3D; }
  .meta b { display:inline-block; width:64px; color:#737370; font-weight:500; }
  .meta .subj { font-size:17px; font-weight:600; color:#18181B; margin-bottom:6px; }
  .mailbody { background:#FCFCFB; border:1px solid #DDDDD9; border-top:0; border-radius:0 0 10px 10px; padding:24px; }
</style>
</head>
<body>
<div class="frame">
  <div class="meta">
    <div class="subj">John invited you to Alliance Social Analytics</div>
    <div><b>From</b> Alliance Social Analytics &lt;SocialMediaReport@c21anj.com&gt;</div>
    <div><b>To</b> karinapopdan@gmail.com</div>
  </div>

  <div class="mailbody">
    <div style="max-width:520px;margin:0 auto;background:#FFFFFF;border:1px solid #E5E5E2;border-radius:12px;overflow:hidden;">
      <div style="background:#252526;padding:22px 24px;border-bottom:3px solid #C9A84C;">
        <div style="font-size:11px;font-weight:700;letter-spacing:0.16em;text-transform:uppercase;color:#C9A84C;">
          Century 21 Alliance
        </div>
        <div style="margin-top:4px;font-size:20px;font-weight:600;color:#FFFFFF;">
          Alliance Social Analytics
        </div>
      </div>
      <div style="padding:28px 24px 30px;">
        <p style="margin:0 0 20px;font-size:18px;font-weight:600;color:#18181B;">
          Hi Karina, your account is ready.
        </p>
        <a href="#" style="display:inline-block;background:#C9A84C;color:#FFFFFF;text-decoration:none;font-size:15px;font-weight:600;padding:12px 24px;border-radius:8px;">
          Create your password
        </a>
      </div>
    </div>
  </div>
</div>
</body>
</html>
