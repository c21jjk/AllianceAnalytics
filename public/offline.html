<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Offline — Alliance Social</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #fcfcfb;
        color: #171717;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        text-align: center;
        padding: 24px;
      }
      .card { max-width: 320px; }
      img { width: 72px; height: 72px; border-radius: 16px; margin-bottom: 16px; }
      h1 { font-size: 20px; margin: 0 0 8px; }
      p { font-size: 15px; color: #525252; line-height: 1.5; margin: 0 0 20px; }
      button {
        background: #c9a84c;
        color: #171717;
        border: 0;
        border-radius: 10px;
        padding: 12px 24px;
        font-size: 15px;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <img src="/brand/app-icons/icon-192.png" alt="" />
      <h1>You&rsquo;re offline</h1>
      <p>Alliance Social needs a connection to load live data. Check your signal and try again.</p>
      <button onclick="location.reload()">Retry</button>
    </div>
  </body>
</html>
