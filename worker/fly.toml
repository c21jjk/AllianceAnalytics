# fly.toml — AllianceAnalytics Reel render worker
#
# Deploy: `fly deploy` from inside the worker/ directory.
# Secrets live in `fly secrets` (see README) — never commit any.

app = "alliance-reel-render"
# why iad: Supabase project lives US-East. Same-region cuts upload
# latency for the rendered MP4 to single-digit ms.
primary_region = "iad"

[build]

# why one [http_service] block + internal_port 8080: the worker exposes
# a single HTTP surface. Fly's proxy terminates TLS on 80/443 and
# forwards to internal_port over the private network.
[http_service]
  internal_port = 8080
  force_https = true
  # 2026-07-23 — autostop DISABLED + one machine always on. why: Fly's
  # proxy stops a machine when it has no ACTIVE CONNECTIONS — background
  # CPU work doesn't count. The auto-reel pipeline submits a render and
  # disconnects (202 fire-and-forget), so the proxy saw an "idle" machine
  # and killed it MID-RENDER, losing the in-memory job (Palmer Drive reel,
  # 2026-07-23). The manual Studio flow never hit this because its 1.5s
  # status polling kept a connection open. Cost of always-on shared-cpu-2x
  # is ~$4/mo — cheaper than one lost reel.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  # Fly's built-in HTTP health check, in addition to the Dockerfile's
  # container-level HEALTHCHECK. Belt + braces — the Fly check decides
  # routing, the Docker check decides restart.
  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/health"

# why shared-cpu-2x + 2048 MB on Day 2: ffmpeg encoding of a 7s 1080×1920
# H.264 video uses ~1-2 GB of RAM at peak (motion estimation buffers,
# AAC audio encoder, our PNG frame queue) and finishes ~2x faster on 2
# cores. Chromium also benefits from the extra core. The Day-1 sizing of
# shared-cpu-1x / 1GB worked for the stub but would OOM on real encodes.
# Cost: ~$0.005/hour while running, $0 while stopped (auto_stop_machines
# = "stop" above). At Larissa's expected 100 reels/month, total Fly cost
# lands around $2-4/mo of actual compute.
[[vm]]
  size = "shared-cpu-2x"
  memory = "2048mb"
  cpu_kind = "shared"
  cpus = 2
  processes = ["app"]

# Env vars set at the platform level (NON-secret). Secrets
# (WORKER_AUTH_TOKEN, SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY) are set
# with `fly secrets set` — see README.
[env]
  LOG_LEVEL = "info"
  PORT = "8080"
